services:
  # ==========================================
  # 1. DATABASE (POSTGRESQL 16)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: varta-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varta_secure_free_db_pass_2026}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. VARTA BACKEND SERVER (EXPRESS/NODE + WS)
  # ==========================================
  varta-server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: varta-server
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      # PostgreSQL connection (internal Docker network)
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-varta_secure_free_db_pass_2026}
      # App domain (dynamic — set via GH secret APP_URL)
      APP_URL: ${APP_URL:-http://localhost}
      VITE_APP_URL: ${APP_URL:-http://localhost}
      ALLOWED_ORIGINS: ${APP_URL:-*},http://localhost,http://localhost:5173
      # Upload path
      UPLOAD_DIR: /var/lib/varta/uploads
      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Varta <noreply@varta.app>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-yash.makwana.b@gmail.com}
      # Firebase Admin (for Push Notifications + Auth verification)
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY:-}
    volumes:
      - uploads-data:/var/lib/varta/uploads
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # 3. NGINX REVERSE PROXY & STATIC HOST
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: varta-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../dist:/var/www/html:ro
    depends_on:
      - varta-server

volumes:
  db-data:
    name: varta-db-data
  uploads-data:
    name: varta-uploads-data
