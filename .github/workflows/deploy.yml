name: Deploy to Vercel Production

# ==============================================================================
# DEPLOYMENT SETUP INSTRUCTIONS:
# To make this deployment work, you MUST add the following Repository Secrets 
# in your GitHub Settings (Settings -> Secrets and variables -> Actions):
# - VERCEL_ORG_ID
# - VERCEL_PROJECT_ID
# - VERCEL_TOKEN
# - VITE_SUPABASE_URL
# - VITE_SUPABASE_ANON_KEY
# 
# (Google OAuth is handled entirely by Supabase and does not need secrets here)
# ==============================================================================
on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_ZxOLeqG2tugBTNWa4wWGstfC' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_ajaKTtPGqbDZ0WASELkiv1oL0l6E' }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ env.VERCEL_TOKEN }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_TURN_SERVER_URL: ${{ secrets.VITE_TURN_SERVER_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}

      - name: Deploy Project Artifacts to Vercel
        run: >
          vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }}
          -e VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          -e VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          -e VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}"
          -e VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
          -e VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
          -e VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
          -e VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}"
          -e VITE_FIREBASE_VAPID_KEY="${{ secrets.VITE_FIREBASE_VAPID_KEY }}"
          -e VITE_TENOR_API_KEY="${{ secrets.VITE_TENOR_API_KEY }}"
          -e VITE_GIPHY_API_KEY="${{ secrets.VITE_GIPHY_API_KEY }}"
          -e VITE_TURN_SERVER_URL="${{ secrets.VITE_TURN_SERVER_URL }}"
          -e VITE_TURN_USERNAME="${{ secrets.VITE_TURN_USERNAME }}"
          -e VITE_TURN_CREDENTIAL="${{ secrets.VITE_TURN_CREDENTIAL }}"
          -e VITE_APP_URL="${{ secrets.VITE_APP_URL }}"
          -e SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
          -e FIREBASE_SERVICE_ACCOUNT_KEY='${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}'
